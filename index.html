<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A quiet journal about finding hope, faith and healing in ordinary days.">
    <title>Passionate about God! | A journal of hope</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl: #fdfbfb;
            --rose-rich: #b05c75;
            --rose-hover: #964a60;
            --plum-border: #9d7d8a;
            --text-dark: #4a333d;
            --text-muted: #7a666e;
        }
        * { box-sizing: border-box; }
        body { 
            background-color: var(--pearl); 
            color: var(--text-dark); 
            font-family: 'Nunito', sans-serif; 
        }
        .serif { font-family: 'Lora', serif; }
        
        .hero-wash {
            background: radial-gradient(circle at 10% 20%, #fad2e1 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, #dbe7e4 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #fcece0 0%, transparent 60%);
            background-color: var(--pearl);
        }

        .story-card { transition: all 0.4s ease; }
        .story-card:hover { transform: translateY(-6px); box-shadow: 0 15px 35px rgba(157, 125, 138, 0.25); }
        .fade-in { animation: fade-in 0.6s ease-out both; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-enter { animation: modal-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .toast { animation: toast-in .4s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 20px) scale(0.95); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

        /* Editorial Drop Cap for the first paragraph of a story */
        .story-body p:first-of-type::first-letter {
            font-family: 'Lora', serif;
            font-size: 3.5rem;
            float: left;
            margin-top: 0.15rem;
            margin-right: 0.5rem;
            margin-bottom: -0.5rem;
            line-height: 1;
            color: var(--rose-rich);
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--pearl); }
        ::-webkit-scrollbar-thumb { background: var(--plum-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--rose-rich); }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-[#fad2e1] selection:text-[#4a333d]">
    
    <!-- Reading Progress Bar -->
    <div id="progress-bar" class="fixed top-0 left-0 h-1 bg-[#b05c75] z-50 transition-all duration-150 w-0"></div>

    <header class="fixed top-0 w-full z-20 bg-white/85 backdrop-blur-md border-b-2 border-[#9d7d8a]">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
            <button id="home-button" class="flex items-center gap-3 text-left group" aria-label="Go to the homepage">
                <div class="grid place-items-center w-10 h-10 rounded-full bg-gradient-to-br from-[#fad2e1] to-[#fcece0] border-2 border-[#9d7d8a] group-hover:scale-105 transition duration-300 shadow-sm">
                    <span class="serif text-xl italic text-[#b05c75] font-bold">H</span>
                </div>
                <span>
                    <strong class="serif text-xl tracking-tight text-[#4a333d]">Passionate about God!</strong>
                    <span class="block text-[11px] uppercase tracking-widest text-[#7a666e] mt-0.5">A journal of hope</span>
                </span>
            </button>
            <div class="flex items-center gap-3">
                <button onclick="openAboutModal()" class="text-sm font-bold text-[#7a666e] hover:text-[#b05c75] transition border-2 border-transparent hover:border-[#9d7d8a] px-4 py-2 rounded-full bg-white shadow-sm">About Blessy Mary</button>
            </div>
        </div>
    </header>

    <main class="pt-20">
        <section class="hero-wash relative overflow-hidden border-b-2 border-[#9d7d8a]">
            <div class="max-w-6xl mx-auto px-5 py-16 md:py-28 grid lg:grid-cols-[1.1fr_.9fr] gap-12 items-center">
                <div class="fade-in z-10">
                    <p id="hero-eyebrow" class="uppercase tracking-[.18em] text-xs font-extrabold text-[#b05c75] mb-5 bg-white/60 inline-block px-3 py-1 rounded-full border border-[#9d7d8a]"></p>
                    <h1 id="hero-headline" class="serif text-5xl md:text-6xl font-semibold leading-tight text-[#4a333d] mb-6"></h1>
                    <p id="hero-subtext" class="text-lg font-medium leading-relaxed text-[#5c4a52] max-w-xl"></p>
                    <div class="mt-8 flex flex-wrap gap-4">
                        <button id="latest-button" class="rounded-full bg-[#b05c75] text-white px-7 py-3.5 font-bold hover:bg-[#964a60] border-2 border-[#7a3b50] shadow-lg transition duration-300 flex items-center gap-2">
                            Read the latest story <span aria-hidden="true">&rarr;</span>
                        </button>
                        <a href="#stories" class="rounded-full bg-white border-2 border-[#9d7d8a] px-7 py-3.5 font-bold text-[#4a333d] hover:bg-[#fae8ed] hover:text-[#b05c75] shadow-sm transition duration-300">
                            Explore the journal
                        </a>
                    </div>
                </div>
                <div class="relative hidden lg:block fade-in z-10" style="animation-delay:.15s">
                    <div class="bg-white/70 backdrop-blur-md rounded-[2rem] p-8 md:p-10 relative border-2 border-[#9d7d8a] shadow-xl rotate-2 group hover:rotate-0 transition duration-500">
                        <span class="text-[#fad2e1] text-6xl serif absolute top-4 left-6">"</span>
                        <p id="hero-verse" class="serif text-3xl leading-tight mt-6 text-[#4a333d] italic relative z-10"></p>
                        <p id="hero-reference" class="text-sm font-extrabold tracking-widest uppercase text-[#b05c75] mt-8 text-right"></p>
                    </div>
                    <div class="absolute -bottom-6 -left-4 bg-[#fcece0] border-2 border-[#9d7d8a] px-5 py-3 rounded-full text-sm font-bold text-[#b05c75] shadow-md -rotate-6">You are not walking alone.</div>
                </div>
            </div>
        </section>

        <section id="stories" class="max-w-6xl mx-auto px-5 py-16 relative z-10">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
                <div>
                    <p class="text-xs uppercase tracking-[.2em] font-extrabold text-[#b05c75] mb-2">The Archive</p>
                    <h2 class="serif text-4xl font-semibold text-[#4a333d]">Stories for the in-between</h2>
                </div>
                <div class="flex gap-3 w-full md:w-auto">
                    <label class="relative flex-1 md:w-72">
                        <span class="sr-only">Search stories</span>
                        <input id="search-input" type="search" placeholder="Search the journal..." class="w-full rounded-full bg-white border-2 border-[#9d7d8a] px-6 py-3 text-sm font-medium outline-none focus:border-[#b05c75] focus:ring-2 focus:ring-[#fad2e1] transition placeholder:text-[#9d7d8a] shadow-sm">
                    </label>
                </div>
            </div>
            <div id="category-nav" class="flex flex-wrap gap-3 mb-10" role="tablist" aria-label="Story categories"></div>
            <div id="app-view" aria-live="polite"></div>
        </section>
    </main>

    <!-- BEAUTIFUL ABOUT MODAL OVERLAY -->
    <div id="about-modal" class="fixed inset-0 z-50 hidden bg-[#4a333d]/60 backdrop-blur-sm p-4 sm:p-6 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="min-h-full flex items-center justify-center">
            <div class="bg-[#fdfbfb] border-2 border-[#9d7d8a] rounded-[2rem] w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col md:flex-row relative modal-enter">
                
                <button onclick="closeAboutModal()" class="absolute top-5 right-5 z-10 w-10 h-10 rounded-full bg-white border-2 border-[#9d7d8a] flex items-center justify-center text-[#7a666e] hover:bg-[#fad2e1] hover:text-[#b05c75] transition shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <div class="w-full md:w-2/5 h-64 md:h-auto bg-[#fcece0] relative border-b-2 md:border-b-0 md:border-r-2 border-[#9d7d8a]">
                    <img id="about-image" src="" alt="Blessy Mary" class="absolute inset-0 w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700">
                </div>

                <div class="w-full md:w-3/5 p-8 md:p-12 relative">
                    <div class="absolute top-0 right-0 w-40 h-40 bg-[#fad2e1] opacity-30 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
                    
                    <span class="inline-block bg-[#fae1e7] text-[#b05c75] px-3 py-1 rounded-full text-[10px] uppercase tracking-widest font-extrabold mb-4 border border-[#9d7d8a]">Meet the Author</span>
                    <h2 class="serif text-4xl font-semibold text-[#4a333d] mb-6">Blessy Mary</h2>
                    
                    <p id="about-bio" class="text-base font-medium leading-relaxed text-[#5c4a52] whitespace-pre-wrap mb-8"></p>
                    
                    <div class="h-[2px] w-full bg-[#9d7d8a]/20 mb-8"></div>
                    
                    <h3 class="text-xs uppercase tracking-widest font-extrabold text-[#7a666e] mb-4">Connect with me</h3>
                    <div class="flex flex-wrap gap-3">
                        <a id="link-email" href="#" class="rounded-xl bg-white border-2 border-[#9d7d8a] px-5 py-2.5 text-sm font-extrabold text-[#4a333d] hover:bg-[#fcece0] shadow-sm transition flex items-center gap-2">
                            <svg class="w-4 h-4 text-[#b05c75]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            Email
                        </a>
                        <a id="link-instagram" href="#" target="_blank" class="rounded-xl bg-white border-2 border-[#9d7d8a] px-5 py-2.5 text-sm font-extrabold text-[#4a333d] hover:bg-[#fad2e1] shadow-sm transition flex items-center gap-2">
                            <svg class="w-4 h-4 text-[#b05c75]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke-width="2"></rect><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zm1.5-4.87h.01"></path></svg>
                            Instagram
                        </a>
                        <a id="link-website" href="#" target="_blank" class="rounded-xl bg-white border-2 border-[#9d7d8a] px-5 py-2.5 text-sm font-extrabold text-[#4a333d] hover:bg-[#e2efe8] shadow-sm transition flex items-center gap-2">
                            <svg class="w-4 h-4 text-[#b05c75]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                            Blogger
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-[#fcece0] border-t-2 border-[#9d7d8a] px-5 py-10 text-sm text-[#7a666e] font-bold">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between gap-4 items-center">
            <span>&copy; 2026 Passionate about God!</span>
            <div class="flex items-center gap-2">
                <span class="text-[#b05c75]">&hearts;</span>
                <span>Made for the waiting, the healing, and the hopeful.</span>
            </div>
        </div>
    </footer>

    <div id="toast" class="hidden fixed bottom-8 left-1/2 z-50 bg-[#4a333d] border-2 border-[#9d7d8a] text-[#fad2e1] px-7 py-3.5 text-sm font-bold shadow-xl rounded-full flex items-center gap-2"></div>

    <script>
        const categories = { inspirationals: 'Inspirationals', beLikeJesus: 'Be like Jesus', quietTime: 'Quiet time', testimony: 'Testimonies' };
        let cachedData = {}, currentCategory = 'inspirationals', currentEntries = [];
        const $ = selector => document.querySelector(selector);
        
        const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
        const slug = (category, index) => `${category}-${index}`;
        
        function openAboutModal() {
            const modal = document.getElementById('about-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeAboutModal() {
            const modal = document.getElementById('about-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
        document.getElementById('about-modal').addEventListener('click', function(e) {
            if (e.target === this || e.target.closest('.min-h-full') === this.firstElementChild && !e.target.closest('.bg-\\[\\#fdfbfb\\]')) {
                closeAboutModal();
            }
        });

        async function fetchContent(category) { 
            if (cachedData[category]) return cachedData[category]; 
            const response = await fetch(`content/${category}.json`); 
            if (!response.ok) return { entries: [] }; 
            cachedData[category] = await response.json(); 
            return cachedData[category]; 
        }

        function showToast(message, duration = 3500) { 
            const toast = $('#toast'); 
            toast.innerHTML = message; 
            toast.classList.remove('hidden');
            toast.classList.add('toast');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast');
            }, duration); 
        }

        function setCategoryButtons() { 
            $('#category-nav').innerHTML = Object.entries(categories).map(([key, label]) => `
                <button data-category="${key}" class="px-6 py-2.5 text-sm font-extrabold rounded-full transition-all duration-300 border-2 ${key === currentCategory ? 'bg-[#b05c75] border-[#7a3b50] text-white shadow-md' : 'bg-white border-[#9d7d8a] text-[#7a666e] hover:bg-[#fad2e1] hover:text-[#b05c75]'}">${label}</button>
            `).join(''); 
        }

        function getLikes(id) { return Number(localStorage.getItem(`likes-${id}`) || 0); }

        function renderCards(entries) { 
            if (!entries.length) { 
                $('#app-view').innerHTML = '<div class="py-16 text-center bg-white rounded-3xl border-2 border-[#9d7d8a]"><p class="text-[#7a666e] font-bold text-lg">More stories are being written. Check back soon.</p></div>'; 
                return; 
            } 
            $('#app-view').innerHTML = `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">${entries.map(({ entry, index }, cardIndex) => { 
                const id = slug(currentCategory, index); 
                const tint = entry.style === 'sage' ? 'bg-[#e2efe8]' : entry.style === 'cream' ? 'bg-[#fcf0d9]' : 'bg-[#fae1e7]'; 
                const titleText = entry.quote || entry.title || "Untitled";
                const bodyText = entry.body ? `<p class="text-sm font-medium text-[#5c4a52] mt-4 line-clamp-3 leading-relaxed">${escapeHtml(entry.body)}</p>` : '';
                const tagText = entry.tag || entry.year || entry.date || "Journal Entry";
                
                return `
                <article class="story-card ${tint} border-2 border-[#9d7d8a] rounded-[2rem] p-7 min-h-[280px] flex flex-col justify-between fade-in group cursor-pointer shadow-sm" data-open="${index}" style="animation-delay:${cardIndex * .06}s">
                    <div>
                        <div class="flex items-center justify-between gap-3 mb-5">
                            <span class="text-xs uppercase tracking-widest font-extrabold text-[#b05c75] bg-white/60 px-3 py-1 rounded-full border border-[#9d7d8a]">${escapeHtml(tagText)}</span>
                            <span class="text-xs text-[#7a666e] font-bold bg-white/60 px-2 py-1 rounded-full border border-[#9d7d8a]">&hearts; ${getLikes(id)}</span>
                        </div>
                        <h3 class="serif text-2xl font-semibold text-[#4a333d] leading-snug group-hover:text-[#b05c75] transition-colors">${escapeHtml(titleText)}</h3>
                        ${bodyText}
                    </div>
                    <div class="flex items-center justify-between mt-8 pt-5 border-t-2 border-[#9d7d8a]/30">
                        <span class="text-xs font-extrabold text-[#7a666e] uppercase tracking-wider">${escapeHtml(entry.attribution || entry.readTime || '')}</span>
                        <span class="text-[#b05c75] font-extrabold text-sm transform group-hover:translate-x-1 transition duration-300 bg-white/60 px-3 py-1 rounded-full border border-[#b05c75]/30">Read &rarr;</span>
                    </div>
                </article>`; 
            }).join('')}</div>`; 
        }

        async function loadCategory(category) { 
            currentCategory = category; 
            setCategoryButtons(); 
            if (window.location.hash.startsWith('#post-')) { history.pushState("", document.title, window.location.pathname + window.location.search); }
            try { 
                const data = await fetchContent(category); 
                currentEntries = data.entries || []; 
                renderCards(currentEntries.map((entry, index) => ({ entry, index }))); 
            } catch (error) { 
                $('#app-view').innerHTML = '<p class="py-16 text-center font-bold text-[#b05c75]">Stories are taking a quiet moment. Please try again.</p>'; 
            } 
        }

        function openPost(index) { 
            const entry = currentEntries[index]; 
            if (!entry) return; 
            const id = slug(currentCategory, index); 
            window.location.hash = `post-${id}`;
            const titleText = entry.quote || entry.title || "Untitled";
            
            // Added the story-body class for the drop cap effect
            const bodyText = entry.body ? `<div class="story-body mt-8 text-lg md:text-xl font-medium leading-loose text-[#4a333d] whitespace-pre-wrap">${escapeHtml(entry.body)}</div>` : '';
            const tagText = entry.tag || entry.year || entry.date || "Journal Entry";

            $('#app-view').innerHTML = `
                <button id="back-button" class="mb-8 inline-flex items-center gap-2 text-sm font-extrabold text-[#7a666e] hover:text-[#b05c75] transition bg-white px-4 py-2 rounded-full border-2 border-[#9d7d8a] shadow-sm">&larr; Back to stories</button>
                <article class="max-w-3xl mx-auto fade-in">
                    <span class="inline-block bg-[#fad2e1] text-[#b05c75] px-4 py-1.5 rounded-full text-xs uppercase tracking-widest font-extrabold mb-5 border-2 border-[#9d7d8a]">${escapeHtml(tagText)}</span>
                    <h2 class="serif text-4xl md:text-5xl font-semibold text-[#4a333d] leading-tight">${escapeHtml(titleText)}</h2>
                    ${bodyText}
                    <p class="mt-8 text-sm uppercase tracking-widest text-[#7a666e] font-extrabold bg-[#fcece0] inline-block px-4 py-2 rounded-lg border-2 border-[#9d7d8a]">${escapeHtml(entry.attribution || entry.readTime || '')}</p>
                    
                    <div class="border-y-2 border-[#9d7d8a] my-12 py-6 flex flex-wrap gap-3">
                        <button id="like-button" class="rounded-full bg-white border-2 border-[#9d7d8a] px-6 py-2.5 text-sm font-extrabold text-[#4a333d] hover:bg-[#fae1e7] hover:text-[#b05c75] shadow-sm transition flex items-center gap-2">
                            <span class="text-xl leading-none text-[#b05c75]">&hearts;</span> <span id="like-count">${getLikes(id)}</span> Likes
                        </button>
                        <button id="copy-button" class="rounded-full bg-white border-2 border-[#9d7d8a] px-6 py-2.5 text-sm font-extrabold text-[#4a333d] hover:bg-[#e2efe8] shadow-sm transition">Copy Link</button>
                        <button id="share-button" class="rounded-full bg-white border-2 border-[#9d7d8a] px-6 py-2.5 text-sm font-extrabold text-[#4a333d] hover:bg-[#fcf0d9] shadow-sm transition">Share Story</button>
                    </div>

                    <section class="bg-[#fdfbfb] p-8 md:p-10 rounded-[2rem] border-2 border-[#9d7d8a] shadow-md relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-[#fad2e1] opacity-40 rounded-full blur-2xl -mr-10 -mt-10"></div>
                        <h3 class="serif text-2xl font-semibold text-[#4a333d] mb-2 relative z-10">Leave a little kindness</h3>
                        <p class="text-sm font-bold text-[#7a666e] mb-8 relative z-10">Sign in with GitHub to share your thoughts publicly.</p>
                        <div id="giscus-container" class="relative z-10"></div>
                    </section>
                </article>`; 

            const script = document.createElement("script");
            script.src = "https://giscus.app/client.js";
            script.setAttribute("data-repo", "YOUR_GITHUB_USERNAME/YOUR_REPO_NAME"); 
            script.setAttribute("data-repo-id", "YOUR_REPO_ID");                     
            script.setAttribute("data-category", "General");                         
            script.setAttribute("data-category-id", "YOUR_CATEGORY_ID");             
            script.setAttribute("data-mapping", "specific");
            script.setAttribute("data-term", id); 
            script.setAttribute("data-strict", "0");
            script.setAttribute("data-reactions-enabled", "1");
            script.setAttribute("data-emit-metadata", "0");
            script.setAttribute("data-input-position", "bottom");
            script.setAttribute("data-theme", "light");
            script.setAttribute("data-lang", "en");
            script.setAttribute("crossorigin", "anonymous");
            script.async = true;
            document.getElementById("giscus-container").appendChild(script);

            $('#back-button').onclick = () => loadCategory(currentCategory); 
            $('#like-button').onclick = () => { const next = getLikes(id) + 1; localStorage.setItem(`likes-${id}`, next); $('#like-count').textContent = next; showToast('<span class="text-[#fad2e1] text-lg leading-none">&hearts;</span> Thanks for sharing the love.'); }; 
            $('#share-button').onclick = () => navigator.share ? navigator.share({ title: titleText, text: `A story from Passionate about God!`, url: location.href }) : showToast('Your browser does not support native sharing.'); 
            $('#copy-button').onclick = async () => { try { await navigator.clipboard.writeText(location.href); showToast('Story link copied to clipboard.'); } catch (err) { showToast('Failed to copy link.'); } }; 
            window.scrollTo({ top: $('#stories').offsetTop - 100, behavior: 'smooth' }); 
        }

        async function handleRouting() {
            const hash = window.location.hash;
            if (hash.startsWith('#post-')) {
                const parts = hash.replace('#post-', '').split('-');
                if (parts.length >= 2) {
                    const index = Number(parts.pop());
                    const category = parts.join('-');
                    await fetchContent(category);
                    currentEntries = cachedData[category]?.entries || [];
                    currentCategory = category;
                    setCategoryButtons();
                    if (currentEntries[index]) { openPost(index); return; }
                }
            }
            await loadCategory('inspirationals');
        }

        $('#category-nav').onclick = event => { const button = event.target.closest('[data-category]'); if (button) loadCategory(button.dataset.category); }; 
        $('#app-view').onclick = event => { const article = event.target.closest('article[data-open]'); if (article) openPost(Number(article.dataset.open)); }; 
        $('#search-input').oninput = event => { const term = event.target.value.toLowerCase(); renderCards(currentEntries.map((entry, index) => ({ entry, index })).filter(({ entry }) => `${entry.quote || ''} ${entry.title || ''} ${entry.tag || ''} ${entry.attribution || ''} ${entry.body || ''}`.toLowerCase().includes(term))); }; 
        $('#latest-button').onclick = () => { if (currentEntries.length) openPost(0); }; 
        $('#home-button').onclick = () => { window.location.hash = ''; loadCategory('inspirationals'); window.scrollTo({ top: 0, behavior: 'smooth' }); }; 

        // Reading Progress Bar Listener
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = scrolled + '%';
        });

        async function init() { 
            try { 
                const site = await (await fetch('content/site.json')).json(); 
                $('#hero-eyebrow').textContent = site.heroEyebrow; 
                $('#hero-headline').textContent = site.heroHeadline; 
                $('#hero-subtext').textContent = site.heroSubtext; 
                $('#hero-verse').textContent = site.heroVerseText.replace(/^\"|\"$/g, ''); 
                $('#hero-reference').textContent = site.heroVerseRef; 
                
                $('#about-bio').textContent = site.aboutBio; 
                $('#about-image').src = site.authorImage || '';
                
                if(site.socialEmail) $('#link-email').href = site.socialEmail; else $('#link-email').style.display = 'none';
                if(site.socialInstagram) $('#link-instagram').href = site.socialInstagram; else $('#link-instagram').style.display = 'none';
                if(site.socialWebsite) $('#link-website').href = site.socialWebsite; else $('#link-website').style.display = 'none';
                
            } catch (error) {} 
            handleRouting();
        } 
        init();
        window.addEventListener('hashchange', handleRouting);
    </script>
</body>
</html>

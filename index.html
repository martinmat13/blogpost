<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspirational Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-6 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <h1 id="site-title" class="text-2xl font-bold tracking-tight text-slate-900 cursor-pointer" onclick="goHome()">Inspirational Journal</h1>
            <a href="/admin/" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">Admin</a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        
        <!-- Category Navigation -->
        <nav id="category-nav" class="flex flex-wrap gap-2 mb-8">
            <button onclick="loadCategory('inspirationals', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-indigo-600 text-white transition">Inspirationals</button>
            <button onclick="loadCategory('beLikeJesus', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 transition">Be Like Jesus</button>
            <button onclick="loadCategory('quietTime', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 transition">Quiet Time</button>
            <button onclick="loadCategory('testimony', this)" class="category-btn px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 transition">Testimonies</button>
        </nav>

        <!-- View Container (Grid vs Detail) -->
        <div id="app-view">
            <!-- Posts Grid will load here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 Inspirational Journal. Built with care.</p>
    </footer>

    <script>
        let currentCategory = 'inspirationals';
        let cachedData = {};

        async function fetchContent(category) {
            if (cachedData[category]) return cachedData[category];
            try {
                const response = await fetch(`content/${category}.json`);
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();
                cachedData[category] = data;
                return data;
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        async function loadCategory(category, btnElement) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 transition";
            });
            if(btnElement) {
                btnElement.className = "category-btn px-4 py-2 rounded-full text-sm font-medium bg-indigo-600 text-white transition";
            }

            const rawData = await fetchContent(category);
            const container = document.getElementById('app-view');

            if (!rawData || !rawData.entries) {
                container.innerHTML = `<p class="text-slate-500 text-center py-12">No entries found in this category yet.</p>`;
                return;
            }

            let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">';
            rawData.entries.forEach((entry, index) => {
                const quote = entry.quote || "";
                const attribution = entry.attribution || "";
                const tag = entry.tag || "";
                // const image = entry.image || "";
                
                let styleClass = "bg-white border-slate-200";
                if (entry.style === 'blush') styleClass = "bg-rose-50/50 border-rose-100";
                if (entry.style === 'sage') styleClass = "bg-emerald-50/50 border-emerald-100";
                if (entry.style === 'cream') styleClass = "bg-amber-50/50 border-amber-100";

                html += `
                    <div onclick="viewPost('${category}', ${index})" class="${styleClass} rounded-2xl border p-6 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between">
                        <!-- ${/* image ? `<img src="${image}" alt="Post image" class="w-full h-40 object-cover rounded-xl mb-4">` : '' */} -->
                        <div>
                            <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-white/80 text-slate-600 border border-slate-200 mb-3">${tag}</span>
                            <p class="text-lg font-medium text-slate-800 mb-4 leading-relaxed">"${quote}"</p>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-sm font-semibold text-slate-500">${attribution}</span>
                            <span class="text-xs font-medium text-indigo-600 hover:underline">Read card &rarr;</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function viewPost(category, index) {
            const rawData = await fetchContent(category);
            const entry = rawData.entries[index];
            const container = document.getElementById('app-view');

            container.innerHTML = `
                <button onclick="loadCategory('${currentCategory}')" class="mb-6 inline-flex items-center text-sm font-medium text-slate-600 hover:text-slate-900">&larr; Back to all posts</button>
                <article class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm max-w-2xl mx-auto">
                    <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 mb-4">${entry.tag || ''}</span>
                    <h2 class="text-2xl md:text-3xl font-medium text-slate-900 mb-6 leading-relaxed">"${entry.quote}"</h2>
                    <!-- ${/* entry.image ? `<img src="${entry.image}" alt="Post image" class="w-full h-72 object-cover rounded-xl mb-6">` : '' */} -->
                    <p class="text-right text-base font-semibold text-slate-600">${entry.attribution}</p>
                </article>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            loadCategory('inspirationals');
        }

        loadCategory('inspirationals');
    </script>
</body>
</html>

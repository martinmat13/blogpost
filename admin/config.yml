backend:
  name: git-gateway
  branch: main

media_folder: "content/images/uploads"
public_folder: "/content/images/uploads"

# The dashboard she sees is organized into these sections,
# matching the sections of the website.
collections:

  - name: "site"
    label: "Homepage & Hero"
    files:
      - file: "content/site.json"
        label: "Homepage Text"
        name: "site"
        fields:
          - { label: "Hero eyebrow line (script text above headline)", name: "heroEyebrow", widget: "string" }
          - { label: "Hero headline", name: "heroHeadline", widget: "string" }
          - { label: "Hero subtext", name: "heroSubtext", widget: "text" }
          - { label: "Hero verse text", name: "heroVerseText", widget: "string" }
          - { label: "Hero verse reference", name: "heroVerseRef", widget: "string" }
          - { label: "About / bio paragraph", name: "aboutBio", widget: "text" }
          - { label: "Stat A value", name: "statAValue", widget: "string" }
          - { label: "Stat A label", name: "statALabel", widget: "string" }
          - { label: "Stat B value", name: "statBValue", widget: "string" }
          - { label: "Stat B label", name: "statBLabel", widget: "string" }
          - { label: "Stat C value", name: "statCValue", widget: "string" }
          - { label: "Stat C label", name: "statCLabel", widget: "string" }
          - { label: "Featured post title", name: "postTitle", widget: "string" }
          - { label: "Featured post excerpt", name: "postExcerpt", widget: "text" }

  - name: "testimony"
    label: "My Testimony (Timeline)"
    files:
      - file: "content/testimony.json"
        label: "Timeline Entries"
        name: "testimony"
        fields:
          - label: "Timeline entries, in order"
            name: "entries"
            widget: "list"
            summary: "{{year}} — {{title}}"
            fields:
              - { label: "Year or label (e.g. 2019, or Today)", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Story", name: "body", widget: "text" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Info circle", value: "circle-info" }
                  - { label: "Moon (night season)", value: "moon" }
                  - { label: "Sparkle (hope)", value: "sparkle" }
                  - { label: "Heart (healing)", value: "heart" }
                  - { label: "Wind (freedom)", value: "wind" }
              - label: "Marker color"
                name: "markerColor"
                widget: "select"
                options: ["blush", "sage", "gold"]

  - name: "quietTime"
    label: "My Quiet Time Study"
    files:
      - file: "content/quietTime.json"
        label: "Journal Entries"
        name: "quietTime"
        fields:
          - label: "Journal entries"
            name: "entries"
            widget: "list"
            summary: "{{date}} — {{title}}"
            fields:
              - { label: "Date (e.g. March 14)", name: "date", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Reflection", name: "body", widget: "text" }

  - name: "beLikeJesus"
    label: "Be Like Jesus Series!"
    files:
      - file: "content/beLikeJesus.json"
        label: "Devotional Steps"
        name: "beLikeJesus"
        fields:
          - label: "Steps, in order"
            name: "entries"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Devotional text", name: "body", widget: "text" }
              - { label: "Read time (e.g. 5 min read)", name: "readTime", widget: "string", default: "5 min read" }

  - name: "inspirationals"
    label: "INSPIRATIONALS!!"
    files:
      - file: "content/inspirationals.json"
        label: "Quotes & Thoughts"
        name: "inspirationals"
        fields:
          - label: "Quote cards"
            name: "entries"
            widget: "list"
            summary: "{{quote}}"
            fields:
              - { label: "Quote or short thought", name: "quote", widget: "text" }
              - { label: "Attribution (e.g. Psalm 30:5, or — Naomi)", name: "attribution", widget: "string" }
              - label: "Category"
                name: "tag"
                widget: "select"
                options: ["Hope", "Strength", "Healing", "Faith"]
              - label: "Card color"
                name: "style"
                widget: "select"
                options: ["blush", "sage", "cream"]

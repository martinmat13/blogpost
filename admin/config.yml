backend:
  name: github
  repo: martinmat13/blogpost
  branch: main
  base_url: https://christiangurl28.vercel.app/api

# Where images are stored
media_folder: "content/images"
public_folder: "content/images"

collections:
  - name: "journal_sections"
    label: "📖 Journal Stories"
    description: "Manage the stories across your four main categories."
    files:
      - file: "content/inspirationals.json"
        label: "1. Inspirationals"
        name: "inspirationals"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category Tag (e.g., Faith, Waiting)", name: "tag", widget: "string", default: "Inspirational"}
              - {label: "Card Color", name: "style", widget: "select", options: ["rose", "sage", "cream"], default: "rose"}
              - {label: "Story Body", name: "body", widget: "text"}
              - {label: "Read Time or Date (e.g., 3 min read)", name: "attribution", widget: "string", required: false}

      - file: "content/quietTime.json"
        label: "2. Quiet Time"
        name: "quietTime"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Quiet Time"}
              - {label: "Card Color", name: "style", widget: "select", options: ["rose", "sage", "cream"], default: "sage"}
              - {label: "Story Body", name: "body", widget: "text"}
              - {label: "Read Time or Date", name: "attribution", widget: "string", required: false}

      - file: "content/beLikeJesus.json"
        label: "3. Be Like Jesus"
        name: "beLikeJesus"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Growth"}
              - {label: "Card Color", name: "style", widget: "select", options: ["rose", "sage", "cream"], default: "cream"}
              - {label: "Story Body", name: "body", widget: "text"}
              - {label: "Read Time or Date", name: "attribution", widget: "string", required: false}

      - file: "content/testimony.json"
        label: "4. Testimonies"
        name: "testimony"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Testimony"}
              - {label: "Card Color", name: "style", widget: "select", options: ["rose", "sage", "cream"], default: "rose"}
              - {label: "Story Body", name: "body", widget: "text"}
              - {label: "Read Time or Date", name: "attribution", widget: "string", required: false}

  - name: "site_settings"
    label: "⚙️ Homepage Settings"
    description: "Edit the main bio and words on the homepage."
    files:
      - file: "content/site.json"
        label: "Homepage Text & Bio"
        name: "site"
        fields:
          - {label: "Top Tiny Text", name: "heroEyebrow", widget: "string"}
          - {label: "Main Big Headline", name: "heroHeadline", widget: "string"}
          - {label: "Subtext under Headline", name: "heroSubtext", widget: "text"}
          - {label: "Bible Verse (Quote box)", name: "heroVerseText", widget: "text"}
          - {label: "Verse Reference", name: "heroVerseRef", widget: "string"}
          - {label: "About Me Bio", name: "aboutBio", widget: "text"}
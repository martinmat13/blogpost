backend:
  name: github
  repo: martinmat13/blogpost
  branch: main
  base_url: https://christiangurl28.vercel.app/api

media_folder: "content/images"
public_folder: "content/images"

collections:
  - name: "journal_sections"
    label: "📖 Journal Stories"
    description: "Manage the stories across your four main categories."
    files:
      - file: "content/inspirationals.json"
        label: "1. Inspirationals"
        name: "inspirationals"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} {{fields.quote}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string", required: false}
              - {label: "Quote / Featured Text", name: "quote", widget: "text", required: false}
              - {label: "Story Body", name: "body", widget: "text", required: false}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Hope"}
              - {label: "Attribution (e.g., Psalm 30:5 or Read Time)", name: "attribution", widget: "string", required: false}
              - {label: "Card Color", name: "style", widget: "select", options: ["blush", "rose", "sage", "cream"], default: "blush"}
              - {label: "Featured Image", name: "image", widget: "image", required: false}

      - file: "content/quietTime.json"
        label: "2. Quiet Time"
        name: "quietTime"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} {{fields.quote}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string", required: false}
              - {label: "Quote / Featured Text", name: "quote", widget: "text", required: false}
              - {label: "Story Body", name: "body", widget: "text", required: false}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Quiet Time"}
              - {label: "Attribution (e.g., Psalm 30:5 or Read Time)", name: "attribution", widget: "string", required: false}
              - {label: "Card Color", name: "style", widget: "select", options: ["blush", "rose", "sage", "cream"], default: "sage"}
              - {label: "Featured Image", name: "image", widget: "image", required: false}

      - file: "content/beLikeJesus.json"
        label: "3. Be Like Jesus"
        name: "beLikeJesus"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} {{fields.quote}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string", required: false}
              - {label: "Quote / Featured Text", name: "quote", widget: "text", required: false}
              - {label: "Story Body", name: "body", widget: "text", required: false}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Growth"}
              - {label: "Attribution (e.g., Psalm 30:5 or Read Time)", name: "attribution", widget: "string", required: false}
              - {label: "Card Color", name: "style", widget: "select", options: ["blush", "rose", "sage", "cream"], default: "cream"}
              - {label: "Featured Image", name: "image", widget: "image", required: false}

      - file: "content/testimony.json"
        label: "4. Testimonies"
        name: "testimony"
        fields:
          - label: "Stories"
            name: "entries"
            widget: "list"
            summary: '{{fields.title}} {{fields.quote}} ({{fields.tag}})'
            fields:
              - {label: "Title", name: "title", widget: "string", required: false}
              - {label: "Quote / Featured Text", name: "quote", widget: "text", required: false}
              - {label: "Story Body", name: "body", widget: "text", required: false}
              - {label: "Category Tag", name: "tag", widget: "string", default: "Testimony"}
              - {label: "Attribution (e.g., Psalm 30:5 or Read Time)", name: "attribution", widget: "string", required: false}
              - {label: "Card Color", name: "style", widget: "select", options: ["blush", "rose", "sage", "cream"], default: "blush"}
              - {label: "Featured Image", name: "image", widget: "image", required: false}

  - name: "site_settings"
    label: "⚙️ Homepage Settings"
    description: "Edit the main bio and words on the homepage."
    files:
      - file: "content/site.json"
        label: "Homepage Text & Bio"
        name: "site"
        fields:
          - {label: "Top Tiny Text", name: "heroEyebrow", widget: "string"}
          - {label: "Main Big Headline", name: "heroHeadline", widget: "string"}
          - {label: "Subtext under Headline", name: "heroSubtext", widget: "text"}
          - {label: "Bible Verse (Quote box)", name: "heroVerseText", widget: "text"}
          - {label: "Verse Reference", name: "heroVerseRef", widget: "string"}
          - {label: "About Me Bio", name: "aboutBio", widget: "text"}

  - name: "comments_moderation"
    label: "💬 Comments Moderation"
    description: "Monitor and delete reader comments."
    files:
      - file: "content/comments_store.json"
        label: "All Comments"
        name: "comments_store"
        fields:
          - label: "Stored Comments"
            name: "entries"
            widget: "list"
            summary: '{{fields.author}}: {{fields.body}}'
            fields:
              - {label: "Post ID", name: "postId", widget: "string"}
              - {label: "Author Name", name: "author", widget: "string"}
              - {label: "Comment Body", name: "body", widget: "text"}
              - {label: "Date", name: "date", widget: "string"}